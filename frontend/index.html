<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Piece 42: jurisvault.ai's fonts — Archivo for display, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Juris Vault AI — Legal Research, With Memory</title>
    <meta name="description" content="Production-grade agentic legal RAG — grounded answers with citations." />
    <script>
      // Piece 35: set the theme class before first paint (no flash).
      // Stored choice wins; otherwise follow the system preference.
      (function () {
        try {
          var t = localStorage.getItem('jurisvault.theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* storage unavailable — stay light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
