<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2321c063'/><text x='16' y='22' font-family='Archivo,serif' font-size='18' fill='%23fafaf9' text-anchor='middle'>J</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Piece 42: jurisvault.ai's fonts — Archivo for display, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Juris Vault AI — Command Center</title>
    <script>
      // Piece 35: set the theme class before first paint (no flash).
      // Stored choice wins; otherwise follow the system preference.
      (function () {
        try {
          var t = localStorage.getItem('jurisvault.theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* storage unavailable — stay light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
